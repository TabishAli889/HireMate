# Render Blueprint for the HireMate API (New + → Blueprint → pick this repo).
# The frontend goes on Vercel; see docs/DEPLOY.md.
services:
  - type: web
    name: hiremate-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true # copy it into Vercel as BACKEND_API_KEY
      - key: GROQ_API_KEY
        sync: false # you'll be asked for it
      - key: DATABASE_URL
        sync: false # a Postgres URL, e.g. from Neon (Render's free disk is wiped on every restart)
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://hiremate-yourname.vercel.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_PLANNER_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: GROQ_PLANNER_REASONING_EFFORT
        value: medium
      - key: AGENT_MAX_STEPS
        value: "12"
      - key: MAX_UPLOAD_MB
        value: "4"
      - key: SEED_DEMO_DATA
        value: "false"
